# ==============================================================================
# Escaneo de secretos — ACTIVO y agnóstico del stack.
# Ejecuta gitleaks sobre el historial para detectar credenciales filtradas.
# Complementa la política de SECURITY.md y docs/conventions/secrets.md.
# Nota: en repos de una organización, gitleaks-action requiere la variable
# GITLEAKS_LICENSE (gratis para cuentas personales).
# ==============================================================================

name: Escaneo de secretos

# En `push` solo `main`: sin protección de ramas nada impide técnicamente un push
# directo a producción, así que ahí el escaneo del historial es un backstop real.
# En `develop` el PR ya lo escaneó, y ese run era duplicado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

# Un push nuevo al PR cancela el escaneo anterior. En `main` no se cancela: ahí
# el escaneo del historial es el que cuenta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# gitleaks-action lee los commits del PR vía API; sin estos permisos el
# GITHUB_TOKEN devuelve 403 (Resource not accessible by integration).
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
